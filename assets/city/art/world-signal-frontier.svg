<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Signal Frontier abstract world art</title>
<desc id="desc">A luminous signal beacon with concentric transmission arcs above a futuristic grid.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101d19"/>
    <stop offset="0.55" stop-color="#152a25"/>
    <stop offset="1" stop-color="#0a1012"/>
  </linearGradient>
  <radialGradient id="pulse">
    <stop offset="0" stop-color="#dfffee" stop-opacity=".95"/>
    <stop offset=".18" stop-color="#91ffd0" stop-opacity=".65"/>
    <stop offset=".55" stop-color="#55d7b0" stop-opacity=".18"/>
    <stop offset="1" stop-color="#55d7b0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#6de9bf" stop-opacity=".02"/>
    <stop offset=".55" stop-color="#7fffd4" stop-opacity=".22"/>
    <stop offset="1" stop-color="#c7ffe9" stop-opacity=".68"/>
  </linearGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
    <path d="M64 0H0V64" fill="none" stroke="#7fffd4" stroke-opacity=".08" stroke-width="1"/>
  </pattern>
</defs>
