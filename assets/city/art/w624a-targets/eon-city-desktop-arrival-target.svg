<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">EON City desktop arrival target</title><desc id="desc">Original stylized art-direction target showing a readable nocturnal command district, player and EONBOT foreground, distinct landmarks, warm entrances, minimal HUD, and open skyline.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#050b18"/><stop offset="0.55" stop-color="#0a1830"/><stop offset="1" stop-color="#163f59"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1a2d"/><stop offset="1" stop-color="#132742"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163f59" stop-opacity=".95"/><stop offset="1" stop-color="#69e7ff" stop-opacity=".22"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1320" cy="145" r="78" fill="#c7dcff" opacity=".16"/><circle cx="1320" cy="145" r="54" fill="none" stroke="#c7dcff" opacity=".4"/>
<path d="M0 265 C340 165 550 315 830 210 S1320 130 1600 245" fill="none" stroke="#9b7cff" stroke-width="18" opacity=".09"/>
<g opacity=".55" fill="#07111e"><path d="M0 520V280h75v240zm92 0V230h90v290zm104 0V325h85v195zm104 0V205h72v315zM1260 520V270h86v250zm105 0V180h72v340zm92 0V300h143v220z"/></g>
<!-- distinct landmark silhouettes -->
<g>
  <path d="M585 545 L620 210 L704 155 L760 225 L792 545 Z" fill="#07111e" stroke="#69e7ff" stroke-width="4"/>
  <path d="M650 495 L650 240 L704 190 L720 495" fill="url(#glass)"/>
  <path d="M704 155 L704 92" stroke="#69e7ff" stroke-width="7" filter="url(#glow)"/>
  <path d="M526 330 C615 285 760 285 850 330" fill="none" stroke="#69e7ff" stroke-width="12" opacity=".8"/>
  <text x="690" y="365" fill="#c7dcff" font-size="26" font-family="system-ui" text-anchor="middle">COMMAND LOOM</text>
</g>
<g>
  <path d="M880 545 L900 330 L1000 270 L1085 350 L1110 545Z" fill="#0e1a2d" stroke="#9b7cff" stroke-width="4"/>
  <path d="M910 420 L1060 330 L1070 390 L920 480Z" fill="#9b7cff" opacity=".24"/>
  <text x="995" y="462" fill="#c7dcff" font-size="22" font-family="system-ui" text-anchor="middle">CREATOR</text>
</g>
<g>
  <path d="M330 545 L360 345 L430 260 L500 345 L540 545Z" fill="#0e1a2d" stroke="#ffbc68" stroke-width="4"/>
  <path d="M377 398 L430 305 L482 398" fill="none" stroke="#ffbc68" stroke-width="9"/>
  <text x="430" y="470" fill="#c7dcff" font-size="22" font-family="system-ui" text-anchor="middle">FORGE</text>
</g>
<g>
  <path d="M1125 545 Q1215 360 1305 545Z" fill="#0e1a2d" stroke="#92f5c2" stroke-width="4"/>
  <path d="M1155 495 Q1215 405 1275 495" fill="none" stroke="#92f5c2" stroke-width="9" opacity=".7"/>
  <text x="1215" y="505" fill="#c7dcff" font-size="20" font-family="system-ui" text-anchor="middle">LIBRARY</text>
</g>
<!-- street and warm entries -->
<path d="M0 555 L1600 555 L1600 900 L0 900Z" fill="url(#road)"/>
<path d="M690 555 L910 900 L120 900 L600 555Z" fill="#07111e" opacity=".9"/>
<path d="M704 555 L780 900" stroke="#69e7ff" stroke-width="5" opacity=".5"/><path d="M600 555 L435 900" stroke="#69e7ff" stroke-width="3" opacity=".25"/>
<g fill="#ffbc68" filter="url(#glow)"><rect x="668" y="470" width="72" height="85" rx="10" opacity=".85"/><rect x="405" y="475" width="52" height="70" rx="8" opacity=".65"/><rect x="970" y="476" width="55" height="69" rx="8" opacity=".55"/><rect x="1190" y="500" width="48" height="45" rx="8" opacity=".5"/></g>
<!-- player silhouette -->
<g transform="translate(735 610)"><ellipse cx="0" cy="255" rx="75" ry="20" fill="#000" opacity=".35"/><circle cx="0" cy="48" r="28" fill="#c7dcff"/><path d="M-34 80 L-58 245 L0 275 L58 245 L34 80Z" fill="#07111e" stroke="#69e7ff" stroke-width="4"/><path d="M20 105 L48 190" stroke="#9b7cff" stroke-width="9"/><path d="M-30 245 L-45 305M30 245L45 305" stroke="#0e1a2d" stroke-width="25" stroke-linecap="round"/></g>
<!-- EONBOT -->
<g transform="translate(855 675)" filter="url(#glow)"><ellipse rx="48" ry="38" fill="#07111e" stroke="#69e7ff" stroke-width="4"/><ellipse rx="69" ry="52" fill="none" stroke="#9b7cff" stroke-width="6" transform="rotate(-18)"/><circle r="9" fill="#c7dcff"/></g>
<!-- productive NPC vignette -->
<g transform="translate(1110 620)"><circle cx="0" cy="25" r="20" fill="#c7dcff"/><path d="M-28 55 L-40 175 L35 175 L28 55Z" fill="#0e1a2d" stroke="#92f5c2" stroke-width="4"/><rect x="52" y="70" width="115" height="70" rx="12" fill="#07111e" stroke="#92f5c2" stroke-width="3"/><text x="110" y="112" fill="#c7dcff" font-size="18" font-family="system-ui" text-anchor="middle">OPEN PROJECT</text></g>
<!-- minimal HUD -->
<g font-family="system-ui"><rect x="34" y="32" width="360" height="86" rx="22" fill="#07111e" opacity=".88" stroke="#163f59"/><text x="64" y="70" fill="#69e7ff" font-size="18">FIRST CIRCUIT</text><text x="64" y="99" fill="#c7dcff" font-size="24">Reach the Command Loom</text><rect x="1370" y="34" width="94" height="54" rx="18" fill="#07111e" stroke="#163f59"/><text x="1417" y="68" fill="#c7dcff" font-size="18" text-anchor="middle">Share</text><rect x="1476" y="34" width="90" height="54" rx="18" fill="#07111e" stroke="#163f59"/><text x="1521" y="68" fill="#c7dcff" font-size="18" text-anchor="middle">Menu</text></g>
<g font-family="system-ui"><rect x="34" y="790" width="405" height="72" rx="20" fill="#07111e" opacity=".9" stroke="#69e7ff"/><text x="60" y="820" fill="#69e7ff" font-size="16">TARGET FRAME · NOT A RUNTIME SCREENSHOT</text><text x="60" y="847" fill="#c7dcff" font-size="18">Readable nocturne · human scale · useful destination</text></g>
</svg>
