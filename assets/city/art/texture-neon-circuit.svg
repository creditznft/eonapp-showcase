<svg height="1024" width="1024" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="EON City original vector art"><defs>
  <linearGradient id="night" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#030712"/><stop offset=".48" stop-color="#071728"/><stop offset="1" stop-color="#0c2140"/></linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#5eead4"/><stop offset=".45" stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
