  <radialGradient id="glow"><stop stop-color="#b9f7ff" stop-opacity=".72"/><stop offset=".35" stop-color="#5bdcff" stop-opacity=".24"/><stop offset="1" stop-color="#4bd5ff" stop-opacity="0"/></radialGradient>
