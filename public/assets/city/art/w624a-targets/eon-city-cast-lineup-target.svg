<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">EON City cast silhouette target</title><desc id="desc">Original character silhouette board for the Wayfinder player, EONBOT Orbit, and five productive NPC archetypes.</desc>
