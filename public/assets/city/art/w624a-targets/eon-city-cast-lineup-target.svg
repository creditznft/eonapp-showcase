<rect width="1600" height="900" fill="url(#bg)"/>
<text x="64" y="86" fill="#c7dcff" font-size="44" font-family="system-ui" font-weight="700">EON CITY CAST · SILHOUETTE TARGET</text><text x="64" y="126" fill="#69e7ff" font-size="22" font-family="system-ui">Distinct at a glance · useful outcomes · final rigs not yet claimed</text>
