# Owner authorization is separate from CI and Preview. It creates no deployment.
name: Authorize Production Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: CI run ID containing the immutable candidate
        required: true
        type: string
      preview_run_id:
        description: Preview workflow run ID containing the exact-candidate receipt
        required: true
        type: string
      evidence_run_id:
        description: W645 evidence workflow run ID containing redacted W638/W639 PASS or gated evidence
        required: true
        type: string
      candidate_digest:
        description: Expected immutable candidate digest
        required: true
        type: string
      previous_production_deployment_id:
        description: Existing successful Cloudflare production deployment ID approved as rollback target
        required: true
        type: string
      authorization_expiry_minutes:
        description: GO receipt validity window, 15 to 240 minutes
        required: true
        default: '60'
        type: string

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment:
      name: launch-authorization
    steps:
      - name: Validate authorization inputs
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          PREVIEW_RUN: ${{ inputs.preview_run_id }}
          EVIDENCE_RUN: ${{ inputs.evidence_run_id }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          ROLLBACK_ID: ${{ inputs.previous_production_deployment_id }}
          EXPIRY: ${{ inputs.authorization_expiry_minutes }}
        run: |
          for value in "$CANDIDATE_RUN" "$PREVIEW_RUN" "$EVIDENCE_RUN"; do printf '%s' "$value" | grep -Eq '^[0-9]{1,20}$'; done
          printf '%s' "$CANDIDATE_DIGEST" | grep -Eq '^[a-f0-9]{64}$'
          printf '%s' "$ROLLBACK_ID" | grep -Eq '^[A-Za-z0-9._:-]{6,180}$'
          printf '%s' "$EXPIRY" | grep -Eq '^[0-9]{2,3}$'
          test "$EXPIRY" -ge 15 && test "$EXPIRY" -le 240
      - name: Download candidate, Preview and evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh run download "${{ inputs.candidate_run_id }}" --repo "$REPO" --pattern 'eonapp-release-candidate-*' --dir candidate-download
          gh run download "${{ inputs.preview_run_id }}" --repo "$REPO" --pattern 'eonapp-preview-receipt-*' --dir preview-download
          gh run download "${{ inputs.evidence_run_id }}" --repo "$REPO" --pattern 'eonapp-w646-production-evidence-*' --dir evidence-download
      - name: Resolve candidate source identity
        id: candidate
        env:
          EXPECTED_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          ROOT="$(realpath "$(find candidate-download -path '*/candidate-provenance.json' ! -path '*/dist/release/*' -printf '%h\n' | sort | head -n 1)")"
          PREVIEW="$(realpath "$(find preview-download -name preview-receipt.json | head -n 1)")"
          EVIDENCE="$(realpath "$(find evidence-download -name w638-evidence-index.json -printf '%h\n' | head -n 1)")"
          test -n "$ROOT" && test -n "$PREVIEW" && test -n "$EVIDENCE"
          test "$(jq -r .candidateDigest "$ROOT/candidate-provenance.json")" = "$EXPECTED_DIGEST"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "preview=$PREVIEW" >> "$GITHUB_OUTPUT"
          echo "evidence=$EVIDENCE" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .commitSha "$ROOT/candidate-provenance.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
          path: source
      - name: Verify exact candidate again
        run: node source/scripts/w641-verify-release-candidate.mjs "${{ steps.candidate.outputs.root }}" "${{ inputs.candidate_digest }}"
      - name: Capture GitHub production environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EON_PRODUCTION_SECRETS_SCOPED: 'true'
        run: |
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPO}/environments/production" > production-environment.json
          grep -q 'required_reviewers' production-environment.json
          grep -q 'deployment_branch_policy' production-environment.json
          node source/scripts/w641-create-environment-receipt.mjs production-environment.json environment-protection.json
      - name: Validate production promotion and issue protected owner GO receipt
        env:
          EON_OWNER_GO_EXPIRY_MINUTES: ${{ inputs.authorization_expiry_minutes }}
        run: |
          node source/scripts/w641-create-owner-authorization.mjs \
            "${{ steps.candidate.outputs.root }}" \
            "${{ steps.candidate.outputs.preview }}" \
            "${{ steps.candidate.outputs.evidence }}" \
            environment-protection.json \
            "${{ inputs.previous_production_deployment_id }}" \
            authorization-package
          node source/scripts/w641-validate-production-promotion.mjs "${{ steps.candidate.outputs.root }}" authorization-package
      - name: Upload protected authorization package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eonapp-owner-authorization-${{ inputs.candidate_digest }}
          path: authorization-package
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
